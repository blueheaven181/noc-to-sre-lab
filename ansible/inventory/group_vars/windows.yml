---
# Fixed 2026-08-20: this said "labadmin" from whenever this file was first
# written, but no such account has ever existed on winsrv01 - `Get-LocalUser`
# there shows only the built-in Administrator/DefaultAccount/Guest/
# WDAGUtilityAccount. Every terminal session this whole project has actually
# used `Administrator` (every prompt pasted back has read
# `PS C:\Users\Administrator>`), so that's what this should have said all
# along. Never actually surfaced as a bug until tonight, since this is the
# first time a playbook run needed a fresh WinRM connection gated purely on
# this stanza being correct - earlier Windows-tier runs may have been
# authenticating some other way, or just got lucky/were never truly
# verified end-to-end. Worth remembering: a var nobody's forced to prove
# correct can sit wrong for a long time.
ansible_user: Administrator
ansible_password: "{{ vault_windows_admin_password }}"
ansible_connection: winrm
ansible_winrm_transport: ntlm
ansible_winrm_server_cert_validation: ignore   # self-signed cert from bootstrap-winrm.ps1
ansible_port: 5986

# ansible.cfg sets [privilege_escalation] become = True globally, for every
# host in the inventory - correct for the RHEL fleet (sudo), meaningless and
# actively broken for WinRM/PowerShell, which has no concept of sudo at all.
# Hit this for real running the winlogbeat role: "The powershell shell
# family is incompatible with the sudo become plugin". Overriding it here,
# scoped to the windows group only, rather than patching become: false onto
# every individual play in site.yml that targets winsrv01 - this way it's
# fixed for windows_common, winlogbeat, and any future Windows role too.
ansible_become: false

# Requires files/bootstrap-winrm.ps1 to have been run manually on the host first -
# Ansible can't enable WinRM on a box it can't yet reach.
