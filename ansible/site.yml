---
# Run everything:   ansible-playbook site.yml --ask-vault-pass
# Run one tier:     ansible-playbook site.yml --limit mysql_hosts --ask-vault-pass
# Run one tag:      ansible-playbook site.yml --tags common --ask-vault-pass
# Safe exporters, no vault needed:
#                   ansible-playbook site.yml --tags nginx_exporter,rabbitmq_exporter --ask-become-pass
#
# Prereqs before this playbook can do anything:
#   1. Each RHEL host is already registered (subscription-manager register)
#      and pinned to the target minor release (subscription-manager release --set=9.5)
#   2. The Windows host has had files/bootstrap-winrm.ps1 run on it manually once
#   3. inventory/group_vars/all/vault.yml exists with the vault_* secrets
#      (ansible-vault create inventory/group_vars/all/vault.yml — note: MUST be
#      under group_vars/all/, not group_vars/vault.yml directly, or Ansible
#      silently never loads it as variables at all — see the comment in
#      group_vars/all/vars.yml for the full explanation)
#
# IMPORTANT — as of 2026-08-17: none of these roles have ever actually been run
# against the live fleet. Every host was built by hand over SSH (see docs/journal/).
# The mysql/redis/rabbitmq roles set credentials from the vault file, which may no
# longer match what's actually live (e.g. the MySQL password recovered by hand in
# Session 3) — running those tiers unreviewed risks resetting a password out from
# under the currently-working app. Start with `--tags common` only (installs
# node_exporter, safe, no app-tier state touched), and treat the tier-specific
# tags as a deliberate, reviewed decision each time, not a routine re-run.
#
# UPDATE — 2026-08-18: `--tags common` has been run clean across all 7 RHEL
# hosts and windows_exporter is confirmed live on winsrv01 too (see the
# 2026-08-18 journal entry). Four new net-new exporter roles/tags were added
# below (Phase 4 net-new exporters). Two are safe to run right now, no vault
# needed: `nginx_exporter` and `rabbitmq_exporter`. The other two —
# `redis_exporter` and `mysqld_exporter` — need vault.yml to actually exist
# first (they reference vault_redis_password / vault_mysql_root_password /
# vault_mysqld_exporter_password), same caution as the mysql/redis/rabbitmq
# tags above: don't run them until that's been created and reviewed.
#
# UPDATE — 2026-08-19: vault.yml issue fixed (see group_vars/all/vars.yml),
# ALL SIX exporters now confirmed live: node_exporter, windows_exporter,
# nginx_exporter, rabbitmq, mysqld_exporter, redis_exporter. Added `filebeat`
# tag below — no vault dependency, safe to run standalone, ships nginx/mysql/
# rabbitmq logs + journald (covers game-service for now) to Logstash on
# controller01. Remaining Phase 4 work after this: Spring Boot Actuator on
# game-service (app-code, not Ansible) and Winlogbeat on winsrv01 (blocked on
# winsrv01 having an actual workload, still unresolved).

- name: Baseline every RHEL host
  hosts: linux_rhel
  become: true
  tags:
    - common
  roles:
    - common

- name: Nginx reverse proxy / load balancer
  hosts: nginx_hosts
  become: true
  tags:
    - nginx
  roles:
    - nginx

# Safe to run standalone, no vault_* dependency — see UPDATE note above.
- name: nginx Prometheus exporter (net-new)
  hosts: nginx_hosts
  become: true
  tags:
    - nginx_exporter
  roles:
    - nginx_exporter

- name: MySQL data tier
  hosts: mysql_hosts
  become: true
  tags:
    - mysql
  roles:
    - mysql

# NEEDS vault.yml: references vault_mysql_root_password (to create the scoped
# exporter user) and vault_mysqld_exporter_password (its own account). Do not
# run until vault.yml exists and those values have been confirmed correct.
- name: mysqld Prometheus exporter (net-new)
  hosts: mysql_hosts
  become: true
  tags:
    - mysqld_exporter
  roles:
    - mysqld_exporter

- name: Redis cache tier
  hosts: redis_hosts
  become: true
  tags:
    - redis
  roles:
    - redis

# NEEDS vault.yml: references vault_redis_password (must match the requirepass
# value already live on redis01 — do not let this reset it to something else).
- name: Redis Prometheus exporter (net-new)
  hosts: redis_hosts
  become: true
  tags:
    - redis_exporter
  roles:
    - redis_exporter

- name: RabbitMQ messaging tier
  hosts: rabbitmq_hosts
  become: true
  tags:
    - rabbitmq
  roles:
    - rabbitmq

# Safe to run standalone, no vault_* dependency — see UPDATE note above.
- name: RabbitMQ Prometheus plugin (net-new)
  hosts: rabbitmq_hosts
  become: true
  tags:
    - rabbitmq_exporter
  roles:
    - rabbitmq_exporter

- name: JVM game service
  hosts: jvm_app_hosts
  become: true
  tags:
    - jvm_app
  roles:
    - jvm_app

# Safe to run standalone, no vault_* dependency. Ships to Logstash on
# controller01:5044 (already published in docker-compose). Also opens
# firewalld for the beats input on controller01 itself - see the role's
# own comment for why that's bundled in here rather than a separate role.
- name: Filebeat log shipping (net-new)
  hosts: linux_rhel
  become: true
  tags:
    - filebeat
  roles:
    - filebeat

- name: Windows fleet
  hosts: windows
  tags:
    - windows_common
  roles:
    - windows_common
