---
# Needs vault_redis_password — the SAME variable the existing `redis` role
# already references for `requirepass`. That variable doesn't live anywhere
# yet (no inventory/group_vars/vault.yml exists), so this role will fail with
# an undefined-variable error until vault.yml is created with the real,
# already-manually-set REDIS_PASSWORD value (confirmed working via
# `redis-cli -a` per the 2026-08-xx session notes). DO NOT reset or guess a
# new password here — this must match what's actually live.
#
# Check https://github.com/oliver006/redis_exporter/releases for the current
# version — v1.62.0 below is illustrative, confirm before a fresh run.

- name: Create dedicated redis_exporter service account
  ansible.builtin.user:
    name: redis_exporter
    system: true
    shell: /sbin/nologin
    create_home: false

- name: Ensure /opt/monitoring exists
  ansible.builtin.file:
    path: /opt/monitoring
    state: directory
    mode: "0755"

- name: Download redis_exporter
  ansible.builtin.unarchive:
    src: https://github.com/oliver006/redis_exporter/releases/download/v1.62.0/redis_exporter-v1.62.0.linux-amd64.tar.gz
    dest: /opt/monitoring
    remote_src: true
    creates: "/opt/monitoring/redis_exporter-v1.62.0.linux-amd64"

- name: Symlink redis_exporter binary
  ansible.builtin.file:
    src: "/opt/monitoring/redis_exporter-v1.62.0.linux-amd64/redis_exporter"
    dest: /usr/local/bin/redis_exporter
    state: link
    owner: redis_exporter

- name: Install redis_exporter systemd unit
  ansible.builtin.template:
    src: redis_exporter.service.j2
    dest: /etc/systemd/system/redis_exporter.service
    mode: "0600"   # contains vault_redis_password in plaintext - not world-readable
  notify: restart redis_exporter

- name: Enable and start redis_exporter
  ansible.builtin.systemd:
    name: redis_exporter
    enabled: true
    state: started
    daemon_reload: true

- name: Open firewalld for redis_exporter, lab subnet only
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="192.168.11.0/24" port protocol="tcp" port="9121" accept'
    permanent: true
    immediate: true
    state: enabled
