---
- name: Install nginx
  ansible.builtin.dnf:
    name: nginx
    state: present

- name: Remove default welcome config so it doesn't shadow ours
  ansible.builtin.file:
    path: /etc/nginx/conf.d/default.conf
    state: absent

- name: Deploy reverse proxy config for the game service
  ansible.builtin.template:
    src: game-proxy.conf.j2
    dest: /etc/nginx/conf.d/game-proxy.conf
    mode: "0644"
  notify: reload nginx

- name: Allow nginx to make outbound connections to backend (SELinux)
  ansible.posix.seboolean:
    name: httpd_can_network_connect
    state: true
    persistent: true

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Open firewalld for HTTP/HTTPS
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop:
    - http
    - https
