server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: game-service

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql01}:3306/gamedb?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:gameapp}
    password: ${DB_PASSWORD:changeme}

  jpa:
    hibernate:
      # Changed for the casino-lab work (Stage 0): was "update" (Hibernate
      # auto-creates/alters tables). Flyway now owns the schema instead -
      # Hibernate just checks the entity mapping matches what Flyway
      # created and refuses to start if it doesn't, rather than silently
      # changing anything.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  flyway:
    # baseline-on-migrate lets Flyway attach to a database that already has
    # tables in it (the real lab's mysql01, built by ddl-auto before this
    # change) without trying to re-run V1 against a table that already
    # exists. baseline-version: 1 means "treat V1 as already applied there."
    # A genuinely empty database (the Stage 0 Docker proof, any fresh
    # environment) ignores baseline entirely and just runs V1 normally -
    # baseline only matters when non-Flyway-managed tables already exist.
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Pre-Flyway schema (Hibernate ddl-auto)"

  data:
    redis:
      host: ${REDIS_HOST:redis01}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq01}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:gameapp}
    password: ${RABBITMQ_PASSWORD:changeme}
    virtual-host: ${RABBITMQ_VHOST:/game}

management:
  endpoints:
    web:
      exposure:
        # Added 2026-08-20: "prometheus" wasn't listed here before, so even
        # once the micrometer-registry-prometheus dependency exists,
        # Spring Boot won't expose the endpoint over HTTP without this.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.noclab.gameservice: INFO
