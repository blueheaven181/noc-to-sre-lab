# Beats input — Filebeat (RHEL fleet) and Winlogbeat (winsrv01) both ship here
# once deployed via Ansible. Not yet automated; see docs/architecture.md
# "Logs — ELK".
input {
  beats {
    port => 5044
  }
}

filter {
  # Deliberately minimal for now — get log lines flowing into Elasticsearch
  # first, confirm they land in Kibana, THEN add per-source parsing (nginx
  # access-log grok pattern, JSON parsing for game-service's structured app
  # log, etc.) as its own pass. Same "prove it works end-to-end before you
  # polish it" approach used for the app pipeline in Phase 3.
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "noclab-%{[agent][type]}-%{+YYYY.MM.dd}"
  }
}
